rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Integration is event-driven via Control4 websocket (director_utils.py / __init__.py), not polling.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: Standard HA config entry removal flow applies; no custom removal steps needed.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: All per-entry state lives on entry.runtime_data (Control4ConfigEntry alias in const.py); hass.data[DOMAIN] is only used for the global HTTP export-view registration flag.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: done
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery: done
  discovery-update-info:
    status: exempt
    comment: Controller address does not change via discovery after initial setup; not applicable.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Device set is static per director export; no stale-device cleanup applicable.

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
